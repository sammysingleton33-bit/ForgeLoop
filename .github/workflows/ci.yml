# FORGELOOP CI (owner: FORGE-05). Runs on PRs and on pushes to main.
#   tools  — forge tooling tests + task validation; every PR event and every push to main (D-014)
#   ownership (G8) — PRs only: every changed file belongs to the PR's owner (title prefix [FORGE-0N] /
#            [CODEX], else branch forge/0N-...) or is allowed by an exception in
#            production/quality-gates/ownership.json (tools/check_ownership.py). Pushes to main are
#            merges and D-014 bookkeeping, so they are not checked. A title change needs a new push.
#   roblox — pinned release binaries (no compiling, D-015) + roblox/scripts/check.sh. Skipped for
#            draft PRs (D-016: drafts are never merged; marking a PR ready for review runs it) and,
#            via its first step, when nothing Roblox-related changed (e.g. D-014/D-018 bookkeeping
#            pushes to main), so metered minutes (D-015) go to code. On pushes to main that run it,
#            the places are stamped (BuildInfo) and uploaded as artifacts forgeloop-main-<short sha>
#            (framework sandbox, forgeloop-main-<short sha>.rbxl) and forgeloop-game001-<short sha>
#            (AI Kingdoms, forgeloop-game001-<short sha>.rbxl — the place for Studio playtests).
#   fairness-full — pushes to main that touch the duel, support or the fairness gate: the full Crown Arena
#            sweep (FORGE_FAIRNESS_FULL=1), report uploaded as forgeloop-fairness-full-<sha> (FL-0076).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# PRs: a new push cancels the PR's older run. Pushes to main: one group per commit, so no merge's
# run (and its artifact) is ever cancelled or dropped from the queue.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tools:
    name: tools (pytest + forge validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest and openpyxl
        # openpyxl: the content library's workbook round-trip tests (tools/tests/test_content.py) skip without it
        run: python -m pip install --disable-pip-version-check pytest "openpyxl==3.1.5"
      - name: Tool tests
        run: python -m pytest -q tools/tests
      - name: Validate tasks
        run: python tools/forge.py validate

  ownership:
    name: ownership (G8)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # merge base of the PR base and the merge commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Changed files belong to the PR's owner
        env:
          # Passed through env, never interpolated into the script: titles are untrusted text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The checkout is GitHub's test merge commit (refs/pull/N/merge); its first parent is the
        # base branch as of this run. pull_request.base.sha can be older: when main moved by a
        # D-014 direct push and the PR branch then merged main, main's own commits were charged to
        # the PR (false FAIL on PR #12). Fall back to base.sha only if HEAD is not a merge commit.
        run: |
          if git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            base="$(git rev-parse 'HEAD^1')"
          else
            base="$BASE_SHA"
          fi
          python tools/check_ownership.py --base "$base" --head HEAD --explain

  roblox:
    name: roblox (Lune, Selene, StyLua, Rojo, place check)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # check.sh runs each Lune step under STEP_TIMEOUT (600 s), so a hung step still fails in 10 min. The whole job
    # took 13m58s on FL-0125 (#187); on 2026-10-19 it took 22-25 min (sim 3 + world 3 shards, war kit #260) and #263's
    # run was cancelled at 25m16s in sim/long, so the cap is 35 (as fairness-full)
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the change filter below diffs against the PR base / the previous main commit
      - name: Roblox-related changes?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Paths whose change can affect the Roblox gates. No usable base (new branch, failed diff)
          # runs the gates: when in doubt, check.
          pattern='^(roblox/|games/|rokit\.toml$|selene\.toml$|stylua\.toml$|roblox\.yml$|\.gitattributes$|\.github/)'
          range="$BASE...$HEAD"
          if [ "$EVENT" = "push" ]; then range="$BASE..$HEAD"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! files="$(git diff --name-only "$range")"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "change filter: no usable base; running the gates"
          elif printf '%s\n' "$files" | grep -E "$pattern" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "change filter: Roblox-related files changed; running the gates"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "change filter: no Roblox-related file changed; gates SKIPPED. Changed files:"
            printf '  %s\n' "$files"
          fi
      - name: Install pinned tools (rokit.toml versions, release binaries)
        if: steps.changes.outputs.run == 'true'
        run: |
          bash roblox/scripts/ci_install_tools.sh "$RUNNER_TEMP/forge-bin"
          echo "$RUNNER_TEMP/forge-bin" >> "$GITHUB_PATH"
      - name: Stamp build (push to main)
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash roblox/scripts/stamp_build.sh
      - name: Roblox gates
        if: steps.changes.outputs.run == 'true'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bash roblox/scripts/check.sh --require-stamp
          else
            bash roblox/scripts/check.sh
          fi
      - name: Name the place after the commit (push to main)
        id: place
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          short="${GITHUB_SHA::7}"
          cp roblox/build/sandbox.rbxl "roblox/build/forgeloop-main-$short.rbxl"
          cp roblox/build/game-001.rbxl "roblox/build/forgeloop-game001-$short.rbxl"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - name: Upload integrated place
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: forgeloop-main-${{ steps.place.outputs.short }}
          path: roblox/build/forgeloop-main-${{ steps.place.outputs.short }}.rbxl
          if-no-files-found: error
          retention-days: 30
      - name: Upload game-001 place (AI Kingdoms)
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: forgeloop-game001-${{ steps.place.outputs.short }}
          path: roblox/build/forgeloop-game001-${{ steps.place.outputs.short }}.rbxl
          if-no-files-found: error
          retention-days: 30
      - name: Upload Crown Arena fairness report (FL-0076)
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: forgeloop-fairness-${{ steps.place.outputs.short }}
          path: roblox/build/fairness/report.md
          if-no-files-found: warn
          retention-days: 30

  fairness-full:
    # FL-0076 (FORGE-00): the full Crown Arena sweep (2000 duels on every cell, every weapon/armour loadout; 152+
    # bounds, about 16 min) on pushes to main that touch the duel, support or the gate. PRs run the default gate in
    # check.sh (roblox job); this catches a loadout regression the default gate's cells do not cover.
    name: fairness (full sweep, main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Arena-related changes?
        id: changes
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          pattern='^games/game-001/(config/(Duel|Support)\.luau$|src/shared/Arena/|tests/fairness/)|^\.github/workflows/ci\.yml$'
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! files="$(git diff --name-only "$BASE..$HEAD")"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -E "$pattern" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "change filter: no arena file changed; full sweep SKIPPED"
          fi
      - name: Install pinned tools
        if: steps.changes.outputs.run == 'true'
        run: |
          bash roblox/scripts/ci_install_tools.sh "$RUNNER_TEMP/forge-bin"
          echo "$RUNNER_TEMP/forge-bin" >> "$GITHUB_PATH"
      - name: Full fairness sweep
        if: steps.changes.outputs.run == 'true'
        env:
          FORGE_FAIRNESS_FULL: "1"
        run: >-
          lune run roblox/tests/harness/run.luau --project games/game-001/default.project.json
          --specs games/game-001/tests/fairness FairnessGate
      - name: Upload the full fairness report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: forgeloop-fairness-full-${{ github.sha }}
          path: roblox/build/fairness/report.md
          if-no-files-found: warn
          retention-days: 30
